# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g allow-rename off

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Also handle the case where a pane is zoomed
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

# set -g default-shell $SHELL

# Include the theme if available
if-shell "test -f ~/.tmux_theme" "source ~/.tmux_theme"

# Load the yank plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

set-option -g default-terminal screen-256color

set-option -g history-limit 4000

set-option -g status-position top
set-window-option -g status-position top

# Use vi-style keys in copy mode
set -g mode-keys vi

# Vim-style selection and yank in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle


# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
# set -g extended-keys on
# set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
# ---------------------------------------------------------------------------
# Flexoki Light
# ---------------------------------------------------------------------------
set -g pane-active-border-style fg="colour26"
set -g pane-border-style fg="colour239"

set -g message-style fg=#ffffff,bg="colour25"

set -g status-style bg="colour236",fg=#ffffff

setw -g clock-mode-colour "colour25"

set -g status-left-length 50
setw -g status-left " #S "
setw -g status-left-style fg=#ffffff,bg="colour25"

set -g status-right "#[fg=#ffffff,bg="colour25"] #h "

setw -g window-status-format " #I: #W "
setw -g window-status-separator ""
setw -g window-status-style fg=#ffffff

setw -g window-status-current-format " #I: #W "
setw -g window-status-current-style fg=#ffffff,bg="colour239"

setw -g window-status-bell-style fg="colour9"
setw -g window-status-activity-style fg=yellow

set -g pane-active-border-style fg="#205EA6"
set -g pane-border-style fg="#CECDC3"

set -g message-style fg="#FFFCF0",bg="#205EA6"

set -g status-style bg="#F2F0E5",fg="#100F0F"

setw -g clock-mode-colour "#205EA6"

set -g status-left-length 50
setw -g status-left " #S "
setw -g status-left-style fg="#FFFCF0",bg="#205EA6"

set -g status-right "#[fg=#FFFCF0,bg=#205EA6] #h "

setw -g window-status-format " #I: #W "
setw -g window-status-separator ""
setw -g window-status-style fg="#6F6E69"

setw -g window-status-current-format " #I: #W "
setw -g window-status-current-style fg="#100F0F",bg="#DAD8CE"

setw -g window-status-bell-style fg="#AF3029"
setw -g window-status-activity-style fg="#AD8301"
